<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 30 320 525" width="320" height="525" role="img" aria-label="Avatar Oracle - samourai feminine robotique" id="oracle-avatar">
<title>Oracle Agent Avatar</title>
<desc>Robot samourai feminine : dome ceramique avec taches de rousseur, bandeau rouge, katana violet. Etats pilotables via classes CSS sur l'element racine : state-warn, state-error, position-open, tune-active.</desc>
<style>
.led{fill:#1D9E75;stroke:#0F6E56;animation:breath 3s ease-in-out infinite}
.state-warn .led{fill:#EF9F27;stroke:#854F0B}
.state-error .led{fill:#E24B4A;stroke:#791F1F;animation:blink 1s steps(2) infinite}
.blade{opacity:.25;transition:opacity .5s ease}
.position-open .blade{opacity:1}
.tune-active .iris{animation:irispulse 1.2s ease-in-out infinite}
@keyframes breath{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes blink{50%{opacity:.2}}
@keyframes irispulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion: reduce){.led,.iris{animation:none!important}}
</style>

